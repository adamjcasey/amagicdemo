<ion-menu contentId="automagic" *ngIf="config.debuggingDeviceMode">
  <ion-header>
    <ion-toolbar>
      <ion-title>Device Debugging</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-menu-toggle>
      <div class="device-debugging">
        <ion-button (click)="copyDebuggingLogs()" class="copy" color="light">
          <ion-icon slot="icon-only" size="medium" name="copy-outline"></ion-icon>
        </ion-button>

        <div id="device-debugging-logs"></div>
        <div id="device-debugging-stats">
          <p class="uuid"><strong>UUID:</strong> <span></span></p>
          <p class="rssi"><strong>RSSI:</strong> <span></span></p>
          <p class="name"><strong>Name:</strong> <span></span></p>
          <p class="state"><strong>State:</strong> <span></span></p>
          <p class="battery"><strong>Battery:</strong> <span></span></p>
          <p class="dosage"><strong>Dosage:</strong> <span></span></p>
          <p class="is-connected"><strong>Is Connected?:</strong> <span></span></p>
          <p class="is-scanning"><strong>Is Scanning?:</strong> <span></span></p>
        </div>
      </div>
    </ion-menu-toggle>
  </ion-content>
</ion-menu>

<ion-app id="automagic" class="automagic">
  <automagic-alert></automagic-alert>
  <automagic-topbar></automagic-topbar>
  <main 
    #main 
    role="main" 
    class="automagic__wrapper {{ deviceInfo?.model }}" 
    [ngClass]="{ 
      'is-full-screen': config.fullScreen
    }">

    <ion-router-outlet></ion-router-outlet>
    <ion-tabs>
      <automagic-bottom-toolbar></automagic-bottom-toolbar>
    </ion-tabs>
  </main>
</ion-app>

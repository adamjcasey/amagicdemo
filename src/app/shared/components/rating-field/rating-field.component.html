<div 
  class="rating-field"
  [ngClass]="{ 
    'is-invalid': error 
  }">

  <p class="field-label" *ngIf="label">{{ label }}</p>
  <div class="rating-field__rates" [ngClass]="{ 'with-icons': showIcons }">
    <ion-img *ngIf="showIcons; else default" src="/assets/images/rating-fiel--icons-rate.svg"></ion-img>
    <ng-template #default>
      <p>{{ rates[0] }}</p>
      <p>{{ rates[1] }}</p>
    </ng-template>
  </div>
  <div class="rating-field__rate-line">
    <div 
      class="checkpoint" 
      *ngFor="let point of [1, 2, 3, 4, 5]; let i = index" 
      [ngClass]="{
        'is-selected': value === point || point <= value,
        'is-marked': (value === 2 && point === 1) || (value > 2 && value > point),
      }"
      (click)="updateValue(point)"
    >
      <div class="checkpoint__line" *ngIf="point < 5"></div>
    </div>
  </div>
  <input 
    type="number" 
    [value]="value" 
  />

  <!-- [errorText]="slide.content.form.group.get(field.name)?.errors?.['required'] ? 'Please enter your name' : null"  -->
</div>

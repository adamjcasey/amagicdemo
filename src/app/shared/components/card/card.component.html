<div class="card {{ card.cssClasses ? card.cssClasses : null }}" [ngClass]="{
  'is-rendered': card.renderClass,
  'card--stepper': card.type === 'stepper',
  'card--featured': card.type === 'featured',
  'card--simple': card.type === 'simple',
  'card--guide-step': card.type === 'guide-step',
  'card--no-image': !card.asset,
  'card--mindful': card.type === 'mindful',
}">
  <div class="card__indicator" *ngIf="card.type === 'stepper'">
    {{ card.indicator }}
  </div>

  <div class="card__wrapper" (click)="card.action && card.action()">
    <h5 class="card__title" *ngIf="card.title && card.type === 'stepper'">
      {{ card.title }}
    </h5>

    <div class="card__content">
      <figure class="card__image" *ngIf="card.asset">
        <ion-img src="{{ card.asset }}"></ion-img>
      </figure>

      <div class="card__text">
        <h5 class="card__eyebrow" *ngIf="card.eyebrow">{{ card.eyebrow }}</h5>
        <div class="card__indicator" *ngIf="card.type === 'guide-step'">
          {{ card.indicator }}
        </div>
        <h5 class="card__title" *ngIf="card.title && card.type !== 'stepper'" [innerHTML]="sanitizeContent(card.title)"></h5>
        <div class="card__description" *ngIf="card.description" [innerHTML]="sanitizeContent(card.description)"></div>
        <div class="card__disclaimer" *ngIf="card.disclamerText" [innerHTML]="sanitizeContent(card.disclamerText)"></div>
        <a 
          class="card__link {{ card.link.cssClasses ? card.link.cssClasses : null }}" 
          *ngIf="card.link" 
          [ngClass]="{ 'card__link--color-salmon': card.link.color === 'salmon' }" 
          (click)="card.link.action()">
          {{ card.link.label }}
        </a>
      </div>

      <ion-button 
        class="card__button {{ card.button.cssClasses ? card.button.cssClasses : null }}" 
        *ngIf="card.button" 
        (click)="card.button.action()"
        [fill]="card.button.fill" color="purple">
        <ion-icon [src]="card.button.icon" slot="start"></ion-icon>
        {{ card.button.label }}
      </ion-button>
    </div>
  </div>
</div>

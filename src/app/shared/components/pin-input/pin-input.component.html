<div [ngClass]="{ 'is-invalid': error }" class="pin-input">
  <p *ngIf="error" class="error-message">
    {{ error }}
  </p>

  <div class="pin-input__wrapper">
    <input #digit1 type="number" class="pin-input__digit" (input)="limitToOneDigit($event)" (keyup)="onDigit($event)">
    <input #digit2 type="number" class="pin-input__digit" (input)="limitToOneDigit($event)" (keyup)="onDigit($event)" disabled>
    <input #digit3 type="number" class="pin-input__digit" (input)="limitToOneDigit($event)" (keyup)="onDigit($event)" disabled>
    <input #digit4 type="number" class="pin-input__digit" (input)="limitToOneDigit($event)" (keyup)="onDigit($event)" disabled>
  </div>
</div>

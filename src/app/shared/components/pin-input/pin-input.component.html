<div class="pin-input">
  <input id="digit-1" type="number" class="pin-input__digit" (input)="limitToOneDigit($event)" (keyup)="onDigit($event, 1)">
  <input id="digit-2" type="number" class="pin-input__digit" (input)="limitToOneDigit($event)" (keyup)="onDigit($event, 2)" disabled>
  <input id="digit-3" type="number" class="pin-input__digit" (input)="limitToOneDigit($event)" (keyup)="onDigit($event, 3)" disabled>
  <input id="digit-4" type="number" class="pin-input__digit" (input)="limitToOneDigit($event)" (keyup)="onDigit($event, 4)" disabled>
</div>

<div [ngClass]="{ 'is-invalid': error }" class="pin-input">
  <p *ngIf="error" class="error-message">
    {{ error }}
  </p>

  <div class="pin-input__wrapper">
    <input 
      #digit1 class="pin-input__digit" type="number"
      (input)="onInput($event)" 
      (keyup)="onDigitEnter($event)">
    <input 
      #digit2 class="pin-input__digit" type="number" 
      (input)="onInput($event)" 
      (keyup)="onDigitEnter($event)" disabled>
    <input 
      #digit3 class="pin-input__digit" type="number" 
      (input)="onInput($event)" 
      (keyup)="onDigitEnter($event)" disabled>
    <input 
      #digit4 class="pin-input__digit" type="number" 
      (input)="onInput($event)" 
      (keyup)="onDigitEnter($event)" disabled>
  </div>
</div>

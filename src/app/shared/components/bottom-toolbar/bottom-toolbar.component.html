<ion-tab-bar
  id="bottom-toolbar"
  class="bottom-toolbar"
  [ngClass]="{
    'is-open': isOpen,
    'visibility-hidden': excludedPaths.includes(currentRoute)
  }"
  slot="bottom"
  color="light">

  <ion-tab-button tab="home" (click)="goTo('home')" [ngClass]="{
    'is-active': isActivePath('home'),
    'is-blocked': onBoardingTasksCompleted === 0 && !nonBlockHome,
    'hotspot-element': onBoardingTasksCompleted > 0,
  }">
    <ion-icon size="medium" src="/assets/icons/home.svg"></ion-icon>
    Home
  </ion-tab-button>

  <ion-tab-button tab="activity" (click)="goTo('activity')" [ngClass]="{
    'is-active': isActivePath('activity'),
    'is-blocked': !homeConfig.allCompletedDoses,
    'hotspot-element': homeConfig.allCompletedDoses,
  }">
    <ion-icon
      size="medium" src="/assets/icons/activity.svg">
    </ion-icon>
    Activity
  </ion-tab-button>

  <ion-tab-button>
    <ion-button
      [ngClass]="{
        'hotspot-element': homeConfig.flareUpsDemoDone,
        'is-blocked': !homeConfig.flareUpsDemoDone,
      }"
      (click)="toggle()"
      fill="solid" shape="circle" color="purple" size="large">
      <ion-icon slot="icon-only" [name]="isOpen ? 'close-outline' : 'add-outline'"></ion-icon>
    </ion-button>
  </ion-tab-button>

  <ion-tab-button tab="resources" (click)="goTo('resources')" [ngClass]="{
    'is-active': isActivePath('resources'),
    'is-blocked': !homeConfig.allCompletedDoses,
    'hotspot-element': homeConfig.allCompletedDoses,
  }">
    <ion-icon size="medium" src="/assets/icons/resources.svg"></ion-icon>
    Resources
  </ion-tab-button>
  <ion-tab-button tab="settings" (click)="goTo('settings')" [ngClass]="{
    'is-active': isActivePath('settings'),
    'is-blocked': !homeConfig.allCompletedDoses,
    'hotspot-element': homeConfig.allCompletedDoses,
  }">
    <ion-icon size="medium" src="/assets/icons/settings.svg"></ion-icon>
    Settings
  </ion-tab-button>

  <section class="bottom-toolbar__content">
    <div class="cta" (click)="goTo('/home/start-dose/prepare')">
      <ion-img src="/assets/images/start-dose.svg"></ion-img>
      <ion-button
        color="purple">
        Start dose
      </ion-button>
    </div>

    <div class="cta" (click)="goTo('symptoms/add')">
      <ion-img src="/assets/images/add-symptom.svg"></ion-img>
      <ion-button
        color="purple">
        Add Symptom
      </ion-button>
    </div>
  </section>
</ion-tab-bar>

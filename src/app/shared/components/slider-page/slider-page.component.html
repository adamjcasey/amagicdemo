<ion-content [fullscreen]="true" [scrollY]="false">
  <div 
    class="slider-page" 
    [style.background-color]="currentSlide.header?.color 
      ? 'var(' + currentSlide.header.color + ')' 
      : 'var(--color-white)'">

    <div 
      class="slider-page__header" 
      [ngClass]="{ 
        'has-asset': currentSlide.header?.asset, 
        'is-full-size': currentSlide.header?.fullSize, 
        'has-template': currentSlide.header?.template, 
        'is-content-expanded': config?.content?.isExpanded, 
      }">

      <swiper #sliderHeader effect="fade" [allowTouchMove]="false" [autoHeight]="true">
        <ng-template class="slider-page__header-slide" swiperSlide *ngFor="let slide of slides">
          <div class="asset-wrapper" *ngIf="slide.header?.asset">
            <img [src]="slide.header.asset" />
          </div>

          <div 
            class="template-wrapper" 
            *ngIf="slide.header?.template" 
            [innerHTML]="sanitizeContent(slide.header.template)"
          ></div>

          <div class="component-wrapper" *ngIf="slide.header.component">
            <ng-template #componentHeader></ng-template>
          </div>
        </ng-template>
      </swiper>
    </div>

    <div 
      class="slider-page__content" 
      [ngClass]="{ 
        'is-hidden': config.content?.hide,
        'is-expanded': config.content?.isExpanded,
        'has-template': config.content?.template || config.content?.form
      }">

      <div class="wrapper-small">
        <div class="wrapper-small__navigation" [ngClass]="{ 'visibility-hidden': config.content?.showNavigation === false }">
          <div class="swiper-pagination"></div>
        </div>

        <swiper 
          #sliderContent 
          effect="fade" 
          [allowTouchMove]="false" 
          [pagination]="{ el: '.swiper-pagination' }" 
          (swiper)="onSliderInit()"
          (slideChange)="onSlideChange()">

          <ng-template class="wrapper-small__slide" swiperSlide *ngFor="let slide of slides">
            <div class="content-wrapper">
              <div 
                class="template-wrapper" 
                *ngIf="slide.content?.template" 
                [innerHTML]="sanitizeContent(slide.content.template)"
              ></div>

              <div class="cards-wrapper" *ngIf="slide.content?.cards">
                <automagic-card *ngFor="let card of slide.content.cards" [card]="card"></automagic-card>
              </div>

              <div class="form-wrapper" *ngIf="slide.content?.form">
                <form [formGroup]="slide.content.form.group" autocomplete="off">
                  <div class="field-wrapper" *ngFor="let field of slide.content.form.fields">
                    <p class="field-label">{{ field.label }}</p>
                    <ion-input 
                      color="purple" 
                      fill="outline" 
                      mode="md" 
                      [formControlName]="field.name" 
                      [placeholder]="field.placeholder" 
                      [errorText]="slide.content.form.group.get(field.name)?.errors?.['required'] ? 'Please enter your name' : null" 
                      (input)="field.onInput ? field.onInput($event) : null"
                    ></ion-input>
                  </div>
                </form>
              </div>
            </div>

            <div class="actions-wrapper" *ngIf="config?.content?.actions">
              <ion-button 
                *ngFor="let button of config.content.actions; let i = index"
                color="purple" 
                size="large" 
                [disabled]="button.disabled ? true : null" 
                (click)="button.action ? button.action($event) : null" 
                [fill]="
                  button.fill 
                  ? button.fill 
                  : (i % 2 !== 1 && config.content.actions.length > 1 
                    ? 'outline' 
                    : null)
                ">
                {{ button.label }}
              </ion-button>
            </div>
          </ng-template>
        </swiper>
      </div>

      <div 
        class="wrapper-large" 
        [style.background-color]="currentSlide.content?.bgColor 
          ? 'var(' + currentSlide.content.bgColor + ')' 
          : 'var(--color-white)'">

        <div class="wrapper-large__content">
          <div 
            class="wrapper-large__template" 
            *ngIf="config?.content?.template" 
            [innerHTML]="sanitizeContent(config.content.template)"
          ></div>

          <div class="wrapper-large__component">
            <ng-template #componentContent></ng-template>
          </div>
        </div>

        <div class="wrapper-large__toolbar" *ngIf="config.content?.toolbar">
          <div 
            class="wrapper-large__toolbar-template" 
            *ngIf="config.content?.toolbar?.template" 
            [innerHTML]="sanitizeContent(config.content.toolbar.template)"
          ></div>

          <div class="wrapper-large__toolbar-actions" *ngIf="config.content?.toolbar?.actions">
            <ion-button 
              *ngFor="let button of config.content?.toolbar?.actions; let i = index"
              color="purple" 
              size="large" 
              [disabled]="button.disabled ? true : null"
              (click)="button.action ? button.action($event) : null" 
              [fill]="
                button.fill 
                ? button.fill
                : (i % 2 !== 1 && config.content?.toolbar?.actions.length > 1 
                  ? 'outline' 
                  : null)
              ">
              {{ button.label }}
            </ion-button>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>

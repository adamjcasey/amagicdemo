<ion-content [fullscreen]="true" [scrollY]="false">
  <div #videoWrapper class="welcome-page__video-wrapper" slot="fixed">
    <video 
      #videoTag 
      id="welcome-video-intro"
      class="welcome-page__video-intro" 
      src="/assets/videos/welcome.mp4" 
      fullscreen="true"
    ></video>
  </div>

  <automagic-slider-page 
    #sliderPage
    [slides]="slides"
    (onNextSlide)="slideNext($event)"
  ></automagic-slider-page>
</ion-content>

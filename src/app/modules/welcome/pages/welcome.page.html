<ion-content [fullscreen]="true" [scrollY]="false">
  <div #videoWrapper class="welcome-page__video-wrapper">
    <ion-img alt="welcome introduction animation" src="/assets/gifs/welcome-screen.gif"></ion-img>
    <audio autoplay preload="auto" src="assets/gifs/Splash_Screen_Sound.m4a"></audio>
  </div>

  <automagic-slider-page
    #sliderPage
    [slides]="slides"
    (nextSlide)="slideNext($event)"
  ></automagic-slider-page>
</ion-content>

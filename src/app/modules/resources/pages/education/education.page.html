<ion-content [fullscreen]="true">
  <section class="education-page">
    <automagic-hero 
      *ngIf="heroConfig"
      [color]="heroConfig.color" 
      [template]="heroConfig.template" 
    ></automagic-hero>

    <div class="education-page__content ion-padding">
      <automagic-feed-card [config]="post" *ngFor="let post of posts"></automagic-feed-card>
    </div>
  </section>
</ion-content>

<ion-content [fullscreen]="true">
  <section class="home-page">
    <automagic-hero 
      *ngIf="heroConfig"
      [color]="heroConfig.color" 
      [image]="heroConfig.image" 
      [template]="heroConfig.template" 
      [actions]="heroConfig.actions"
    ></automagic-hero>

    <div class="ion-padding">
      <h5 class="home-page__subtitle"> Set up your dosing regimen and track your progress</h5>
      <automagic-card [card]="card"></automagic-card>
    </div>
  </section>
</ion-content>

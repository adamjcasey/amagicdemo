  <div class="pro-tip">
    <ion-icon name="information-circle-outline"></ion-icon>
    <h5><strong>Pro Tip</strong></h5>
    <p>
      <ng-container *ngIf="homeConfig.firstTimeDose; else notFirstDose">
        Most people find it easier to start from one of their thighs.
      </ng-container>
      <ng-template #notFirstDose>
        Last time you injected your <strong>{{ humanizeBodyPartInjected(lastMarkedDose?.bodyPartInjected) }}</strong>.
        <br>We recommend rotating to your
        <ng-container [ngSwitch]="lastMarkedDose?.bodyPartInjected">
          <strong *ngSwitchCase="'top-left'">Left Abdomen.</strong>
          <strong *ngSwitchCase="'top-right'">Right Abdomen.</strong>
          <strong *ngSwitchCase="'bottom-left'">Left Thigh.</strong>
          <strong *ngSwitchCase="'bottom-right'">Right Thigh.</strong>
        </ng-container>
      </ng-template>
    </p>
